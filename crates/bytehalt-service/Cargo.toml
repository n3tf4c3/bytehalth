[package]
name = "bytehalt-service"
description = "Serviço do ByteHalt: monitoramento, bloqueio e pipe autenticado. Roda como Windows Service ou em console (--simulate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bytehalt-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
bytehalt-core.workspace = true
bytehalt-ipc.workspace = true
bytehalt-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
rusqlite.workspace = true
data-encoding.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0"
