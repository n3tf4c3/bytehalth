[package]
name = "bytehalt-setup"
description = "Instalador do ByteHalt: copia os executáveis, registra o serviço, inicialização, atalho e desinstalação."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bytehalt-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytehalt-core.workspace = true
bytehalt-windows.workspace = true
windows-sys.workspace = true
windows-service = "0.8.1"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
