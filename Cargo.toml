[workspace]
resolver = "3"
members = [
    "crates/bytehalt-core",
    "crates/bytehalt-ipc",
    "crates/bytehalt-windows",
    "crates/bytehalt-service",
    "crates/bytehalt-app",
]
# A interface (GPUI) é pesada para compilar; os demais crates formam o padrão do `cargo build`.
default-members = [
    "crates/bytehalt-core",
    "crates/bytehalt-ipc",
    "crates/bytehalt-windows",
    "crates/bytehalt-service",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
sha2 = "0.10"
zeroize = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
data-encoding = "2"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.37", features = ["bundled"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "decbf641b18f1982b3475c037e7c5c554471574f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "decbf641b18f1982b3475c037e7c5c554471574f" }
bytehalt-core = { path = "crates/bytehalt-core" }
bytehalt-ipc = { path = "crates/bytehalt-ipc" }
bytehalt-windows = { path = "crates/bytehalt-windows" }

[patch.crates-io]
# Mesma correção do GPUI no Windows usada no termIAX e no NetLane.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
